name: Java CI with Gradle

# Definisce gli eventi che scatenano il workflow
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    # Utilizza l'ambiente virtuale Linux più recente
    runs-on: ubuntu-latest

    steps:
    # 1. Scarica il codice sorgente del repository nel runner
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Configura l'ambiente Java (JDK) necessario per Gradle
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. Configura Gradle, gestisce la cache delle dipendenze e ottimizza i tempi di build
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    # 4. Fornisce i permessi di esecuzione allo script Gradle Wrapper (se non già presenti)
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 5. Esegue la compilazione e i test del progetto
    - name: Build with Gradle
      run: ./gradlew build
