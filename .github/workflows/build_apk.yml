
name: Build Android APK (Android 15)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept SDK Licenses & Install API 35
      run: |
        yes | sdkmanager --licenses || true
        sdkmanager "platforms;android-35" "build-tools;34.0.0" "platform-tools"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Generate Wrapper & Build APK
      run: |
        gradle wrapper --gradle-version 8.5
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace
      env:
        ANDROID_HOME: ${{ steps.setup-android.outputs.android-home }}

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TradingAnalysisApp-Android15
        path: app/build/outputs/apk/debug/app-debug.apk
