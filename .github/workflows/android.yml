name: Android CI (Build APK)

on:
  push:
    branches: [ "main" ] # Cambia in "master" se la tua tab principale si chiama così
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del codice
      uses: actions/checkout@v4

    - name: Configura Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Concedi i permessi di esecuzione a Gradle
      run: chmod +x ./gradlew

    - name: Compila APK di Debug
      run: ./gradlew assembleDebug

    - name: Carica il file APK negli Assets dell'Action
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
