
name: Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-latest

    steps:
      # 1. Recupera il codice dal repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Configura Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Configura Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # 4. Installa i pacchetti Android necessari
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 5. Configura Gradle 8.13
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # 6. Esegue i test
      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      # 7. Genera APK
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      # 8. Pubblica APK scaricabile
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: analisi-trading-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
